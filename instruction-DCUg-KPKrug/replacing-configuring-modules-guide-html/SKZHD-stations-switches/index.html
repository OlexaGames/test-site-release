<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Участки с данными и поиском</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        input { margin-bottom: 10px; padding: 8px; width: 300px; }
        .section { margin-bottom: 20px; }
        .section h2 { margin-bottom: 10px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        tr:nth-child(even) { background-color: #f9f9f9; }
    </style>
</head>
<body>
    <h1>Данные по участкам с поиском по названию</h1>
    
    <!-- Поле для поиска -->
    <input type="text" id="searchInput" placeholder="Поиск по названию..." onkeyup="searchSections()">
    
    <!-- Контейнер для участков (заполнится JS) -->
    <div id="sectionsContainer"></div>

    <script>
// Функция для загрузки данных из нескольких файлов
        async function loadData() {
            try {
                // Загружаем первый файл
                const response1 = await fetch('data1.json');
                if (!response1.ok) throw new Error('Ошибка загрузки data1.json: ' + response1.status);
                const data1 = await response1.json();
                
                // Загружаем второй файл
                const response2 = await fetch('data2.json');
                if (!response2.ok) throw new Error('Ошибка загрузки data2.json: ' + response2.status);
                const data2 = await response2.json();
                
                // Объединяем все участки
                const allSections = [...data1, ...data2];
                
                // Получаем контейнер
                const container = document.getElementById('sectionsContainer');
                container.innerHTML = ''; // Очищаем
                
                // Для каждого участка создаём блок
                allSections.forEach(section => {
                    // Создаём div для участка
                    const sectionDiv = document.createElement('div');
                    sectionDiv.className = 'section';
                    sectionDiv.id = 'section-' + section.section.replace(/\s+/g, '-');
                    
                    // Заголовок
                    const header = document.createElement('h2');
                    header.textContent = section.section;
                    sectionDiv.appendChild(header);
                    
                    // Таблица
                    const table = document.createElement('table');
                    const thead = document.createElement('thead');
                    thead.innerHTML = `
                        <tr>
                            <th class="th-name">Название</th>
                            <th class="th-num">Номер</th>
                            <th class="th-code1">Код 1</th>
                            <th class="th-code2">Код 2</th>
                        </tr>
                    `;
                    table.appendChild(thead);
                    
                    const tbody = document.createElement('tbody');
                    section.items.forEach(item => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td class="td-name">${item.name}</td>
                            <td class="td-num">${item.num}</td>
                            <td class="td-code1">${item.code1}</td>
                            <td class="td-code2">${item.code2}</td>
                        `;
                        tbody.appendChild(row);
                    });
                    table.appendChild(tbody);
                    
                    sectionDiv.appendChild(table);
                    container.appendChild(sectionDiv);
                });
            } catch (error) {
                console.error('Ошибка:', error);
                alert(error.message);
            }
        }

        // Функция поиска
        function searchSections() {
            let filter = document.getElementById("searchInput").value.toLowerCase();
            
            // Получаем все section div'ы
            let sections = document.querySelectorAll('.section');
            
            sections.forEach(section => {
                let table = section.querySelector('table');
                let rows = table.getElementsByTagName('tr');
                let visibleRows = 0;
                
                // Фильтруем строки (начиная с 1, чтобы пропустить thead)
                for (let i = 1; i < rows.length; i++) {
                    let td = rows[i].getElementsByTagName('td')[0]; // Первая колонка — "name"
                    if (td) {
                        let txtValue = td.textContent || td.innerText;
                        if (txtValue.toLowerCase().indexOf(filter) > -1) {
                            rows[i].style.display = "";
                            visibleRows++;
                        } else {
                            rows[i].style.display = "none";
                        }
                    }
                }
                
                // Если нет видимых строк — скрываем весь участок
                section.style.display = visibleRows === 0 ? "none" : "block";
            });
        }

        // Загружаем данные при загрузке страницы
        window.onload = loadData;
    </script>
</body>

</html>
