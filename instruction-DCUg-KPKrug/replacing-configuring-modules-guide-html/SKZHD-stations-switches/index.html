<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Настройка переключателей на МКУ по станциям СКЖД</title>
    <link rel="icon" href="../../img-css/favicon.jpg" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="station-switches.css">
    <script src="spec-switch.js"></script>
</head>
<body>
    <h1>Настройка переключателей на МКУ по станциям СКЖД</h1>

    <!-- Меню с кнопками -->
    <div id="menu">
        <button onclick="showSearchMode()">Поиск по станции</button>
        <button onclick="showFullList()">Показать весь список</button>
    </div>

    <!-- Контейнер для режима поиска -->
    <div id="searchContainer" style="display: none;">
        <button id="backButtonSearch" onclick="backToMenu()">Вернуться к меню</button>
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="Поиск по названию..." onkeyup="searchSections()">
            <button id="clearSearch" onclick="clearSearch()">✕</button>
        </div>
        <div id="sectionsContainerSearch"></div>
    </div>

    <!-- Контейнер для полного списка -->
    <div id="fullListContainer" style="display: none;">
        <button id="backButtonFull" onclick="backToMenu()">Вернуться к меню</button>
        <div id="sectionsContainerFull"></div>
    </div>
</body>
</html>
